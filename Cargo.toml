[workspace]
members = [
    "win11-act-types",
    "win11-act-embed",
    "win11-act-core",
    "win11-act-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Windows 11 LTSC Activator"]
license = "MIT"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Security"] }
